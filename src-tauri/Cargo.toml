[package]
name = "arete"
version = "0.1.0"
description = "Arete: from Thesis to Production Order"
edition = "2021"

[lib]
# `arete_lib` is the Library core. Integration tests in tests/ call it
# directly, without IPC.
name = "arete_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
blake3 = "1"
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"
